name: Photopea compatibility

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run check:photopea

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: photopea-compatibility-failure
          path: photopea-compatibility-failure.png
          if-no-files-found: ignore
